# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# Scope: the RH program's OWN Lean 4 additions under rh-program/lean/ (the Zeta23/DBN, Zeta23/W1, Zeta23/PairCeiling
# subtrees and the comparator topic `DBN`), which build against Anthropic's Zeta23 library (the parent; it ships no
# formalization.yaml).  Written 2026-09-10 (Session 20, D1 M2a packaging, KICKSTART 10(j)); field names checked against
# schema/v0.4.schema.json fetched from the URL above on 2026-09-10 (the dispatcher's $ref).  `fidelity` is a schema key
# (v0.4 has `fidelity.divergences`), so the ledger below is not an extension.
version: "v0.4"

project:
  name: "rh-program Lean additions (de Bruijn–Newman M2a, W1 checker, A4 grid theorems, Theorem M2 Lemma G)"
  description: >-
    The Lean 4 / Mathlib files this program adds on top of the Zeta23 library.  Headline unit: the de Bruijn–Newman
    milestone M2a — the ray form of Λ ≤ 0.2 at Polymath15 Table 1 row 2, "kernel-checked modulo H1, H2 (H2-B, H2-A,
    H-TAIL), H3" (never "fully machine-checked"): two independent producers' barrier and asymptotic transcripts are
    kernel-checked integer certificates (`decide +kernel`, no `native_decide`), the soundness theorems and the glue are
    Lean proofs, and the five hypotheses named in the label are DISPLAYED, never discharged.  Λ ≤ 0.2 is not proved;
    the bracket of record stays 0 ≤ Λ ≤ 0.2 on the literature.  Earlier units: the W1 rectangle-exclusion checker with
    the argument principle discharged (`cert_of_checkW1_ap`), and the grid-Parseval / corner theorems of the A4 no-go
    paper.  Packaged in the Comparator challenge/solution layout as the topic `DBN` (comparator/config-dbn.json).
    Session 23 (2026-09-17) adds the first unit of Theorem M2 (the Gevrey-localized separation theorem, C2): Lemma G1 —
    the derivative bounds |B_raw^{(k)}| ≤ (k + 1)(72/e)^k k^{2k} for the bump B_raw = exp(−1/(1 − 4v²)) — as the
    Comparator topic `SeparationG1` (comparator/config-separation-g1.json), with NO displayed hypothesis: the statement is
    concrete over Mathlib's `iteratedDeriv` and the exp formula for B_raw.  It is the dress-rehearsal rung of M4 (i)
    (results/c2-m2/followups/PRICING.md §1(b) candidate (i)).  Lemma G itself — the Fourier decay
    ‖B̂(η)‖ ≤ (e²/Z)(1 + (c_B/2)√|η|)e^{−c_B√|η|}, c_B = 2/√(72e), for the bump B = B_raw/Z, its complex-argument form with
    the strip weight e^{|Im z|/2}, and the pure-exponential form (G2) — is the topic `Separation`
    (comparator/config-separation.json), again with NO displayed hypothesis: "a Comparator-checked theorem over Mathlib's
    expNegInvGlue with no displayed hypothesis, axioms propext/Classical.choice/Quot.sound, replayed by nanoda" — the first
    statements of this program that carry no "modulo H" label at all.  Nothing about ζ or RH follows from them.
    Session 23 item 3 (M4 (iii), 2026-09-17) adds the class 𝒞(C₁) of the separation note as the trusted structure
    `Separation.SepConfig C₁` (comparator/ChallengeDeps/SepConfig.lean: the seven fields of Zeta23.ZeroConfig, conjugation
    invariance, and the explicit local count Σ_{|Im ρ − x| ≤ 1} m_ρ ≤ C₁·log(3 + |x|)) and clause 4 of Theorem M2 — the
    in-window on-line noise 0 ≤ N_Z ≤ 2·(87/10)·C₁·log(4 + t + R)/L² for t ≥ 3, L ≥ 50, R ≥ 1 — as the Comparator topic
    `SeparationClause4` (comparator/config-separation-clause4.json), "kernel-checked modulo the DISPLAYED H-b₁
    (sup_η |ηB̂(η)|² ≤ 87/10) and H-B‴ (∫|B‴| ≤ 64231/100)" — never "clause 4 is formalized".  It is the dress-rehearsal
    rung of the clause-6 assembly (PRICING §1(b) candidate (iii)).  The assembly itself is the topic `Separation6`
    (comparator/config-separation6.json): Theorem M2's clause 6 over Z, Z′ : `SepConfig C₁` — for t ≥ 3, 0 < δ ≤ 1/2, the
    L-hypothesis L ≥ 25/δ, L ≥ (4/δ)(log log(3 + t) + 2log(1/δ) + log(2·(87/10)·C₁)), the reflection condition (R*), the
    orbit 1/2 ± δ ± it in Z and both configurations on-line within |Im ρ − t| ≤ 73L off the orbit,
    ‖W_Z(f_{t,L}) − W_{Z′}(f_{t,L})‖ ≥ δ²e^{δL/2} ≥ 1 — "kernel-checked modulo H-edge, H-b₁, H-B‴, H-out — never 'Theorem M2
    is formalized'": H-edge is clause 2's lower bound (κ₋ = 148088/100000), H-out is clause 5 DISPLAYED WHOLE (the
    absolute convergence and the bound e^{−L} of the out-window sum beyond 73L), not proved modulo a one-point check.
    Nothing about ζ or RH follows from it.
    Session 24 item 3, Unit A (2026-09-24; results/c2-m4/PRICING-RESIDUE.md §2 row A; build record
    results/c2-m4/BUILD-NOTES-A.md) re-states the rung and the assembly with the noise constant b₁ PROVED in symbolic
    form: b₁sym := (2e^{−1}/Z)² = ‖B′‖₁² (ChallengeDeps/Separation6b.lean, one definition over the frozen M4 (iii) trusted
    files), with (|η|·‖B̂(η)‖)² ≤ b₁sym a theorem (Zeta23/Separation/B1Sym.lean: one integration by parts with the L¹ norm
    kept, ∫|B′| = 2B(0) by the fundamental theorem of calculus on the two halves, and Z ≤ e^{−1}) — no digit of b₁ and no
    lower bound on Z in any statement.  The topics `SeparationClause4b` (clause 4 modulo H-B‴ only) and `Separation6b`
    (three theorems: the assembly `separation_clause6_assembly_b` with H-b₁ gone and the L-hypothesis carrying
    log(2·b₁sym·C₁) — stronger by log(10.984/8.70) = 0.233 nats; the clause-7 tight pair `separation_clause7_tight_pair`,
    Z′ carrying the on-line double 1/2 ± it at multiplicity 2, note §7.2; and `rstar_of_21L`: t ≥ 3, L ≥ 50,
    25/L ≤ δ ≤ 1/2, 21L ≤ t ⟹ (R*), addendum A1's "t ≥ 21L implies it" as a proved corollary).  Label, binding:
    "Theorem M2's clause-6 assembly is a Comparator-checked theorem over `SepConfig`, modulo the displayed H-edge, H-B‴
    and H-out, on the three standard axioms, replayed by nanoda — with b₁ = ‖B′‖₁² proved, clause 7 folded, and (R*)
    implied by t ≥ 21L as a proved corollary" — never "Theorem M2 is formalized".  The M4 (iii) pairs stay on disk, frozen.
    Nothing about ζ or RH follows from it.
  authors:
    - "Kunal Tyagi (sponsor; directs the program, writes no Lean)"
    - "Claude (Anthropic) — every Lean file, under the sponsor's direction"
  responsible_maintainers:
