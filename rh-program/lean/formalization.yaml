    sentence only: D-R6's range form "Re s ≥ ½ + δ₀ in [T₁, T₂]" needs a box family reaching σ = 1, which no row supplies.
    (m) Box-form conclusion NOT stated (D-R8 fix pass, 2026-09-10; CHECK-fDH-O.md FIX-FIRST 1): `cert_of_checkW1_of_diffOn`,
    hence `cert_of_checkW1_fDH`, `cert_of_checkW1_ap` and the instance corollaries `mpDH_zero`/`arbDH_zero`, conclude only
