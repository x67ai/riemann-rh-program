# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# Scope: the RH program's OWN Lean 4 additions under rh-program/lean/ (the Zeta23/DBN, Zeta23/W1, Zeta23/PairCeiling
# subtrees and the comparator topic `DBN`), which build against Anthropic's Zeta23 library (the parent; it ships no
# formalization.yaml).  Written 2026-09-10 (Session 20, D1 M2a packaging, KICKSTART 10(j)); field names checked against
# schema/v0.4.schema.json fetched from the URL above on 2026-09-10 (the dispatcher's $ref).  `fidelity` is a schema key
# (v0.4 has `fidelity.divergences`), so the ledger below is not an extension.
version: "v0.4"

project:
  name: "rh-program Lean additions (de Bruijn–Newman M2a, W1 checker, A4 grid theorems)"
  description: >-
    The Lean 4 / Mathlib files this program adds on top of the Zeta23 library.  Headline unit: the de Bruijn–Newman
    milestone M2a — the ray form of Λ ≤ 0.2 at Polymath15 Table 1 row 2, "kernel-checked modulo H1, H2 (H2-B, H2-A,
    H-TAIL), H3" (never "fully machine-checked"): two independent producers' barrier and asymptotic transcripts are
    kernel-checked integer certificates (`decide +kernel`, no `native_decide`), the soundness theorems and the glue are
    Lean proofs, and the five hypotheses named in the label are DISPLAYED, never discharged.  Λ ≤ 0.2 is not proved;
    the bracket of record stays 0 ≤ Λ ≤ 0.2 on the literature.  Earlier units: the W1 rectangle-exclusion checker with
    the argument principle discharged (`cert_of_checkW1_ap`), and the grid-Parseval / corner theorems of the A4 no-go
    paper.  Packaged in the Comparator challenge/solution layout as the topic `DBN` (comparator/config-dbn.json).
  authors:
    - "Kunal Tyagi (sponsor; directs the program, writes no Lean)"
    - "Claude (Anthropic) — every Lean file, under the sponsor's direction"
  responsible_maintainers:
    - "Kunal Tyagi"
  license: "Apache-2.0"

repository:
  role: "substantive-development"

