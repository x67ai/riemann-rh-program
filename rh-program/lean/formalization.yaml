  scope: >-
    Complete for the stated units: the M2a ray theorem modulo its five displayed hypotheses (both producer legs), the
    W1 checker soundness modulo H-ENCL, the A4 grid theorems.  Nothing under Zeta23/DBN, Zeta23/W1 or Zeta23/PairCeiling
    contains a `sorry`.  The only `sorry`s in the program's files are the deliberate placeholders of the Comparator
    CHALLENGE side, which states the theorems with `sorry` by design (as the parent's Challenge files do): the seven of
    comparator/Challenge/DBN.lean (proved by comparator/Solution/DBN.lean) and, from Session 23, the one of
    comparator/Challenge/SeparationG1.lean (proved by comparator/Solution/SeparationG1.lean) and the three of
    comparator/Challenge/Separation.lean (proved by comparator/Solution/Separation.lean) and the one of
    comparator/Challenge/SeparationClause4.lean (proved by comparator/Solution/SeparationClause4.lean) and the one of
    comparator/Challenge/Separation6.lean (proved by comparator/Solution/Separation6.lean); nothing under
    Zeta23/Separation contains a `sorry`.  From Session 24 (Unit A), also the one of
    comparator/Challenge/SeparationClause4b.lean (proved by comparator/Solution/SeparationClause4b.lean) and the three of
    comparator/Challenge/Separation6b.lean (proved by comparator/Solution/Separation6b.lean); still nothing under
    Zeta23/Separation contains a `sorry`.  From Session 25 (Unit B), also the one of
    comparator/Challenge/SeparationClause5Sum.lean (proved by comparator/Solution/SeparationClause5Sum.lean; clause 5's
    summability, no displayed hypothesis); still nothing under Zeta23/Separation contains a `sorry`.  Not formalized, and
    displayed as hypotheses:
    H1 (Platt–Trudgian), H2-B / H2-A / H-TAIL (the untrusted producers' enclosure claims), H3 (Polymath15 Theorem 1.2 in
    the amended form `Polymath15Bridge'`, and the entirety of H_t) — see `fidelity`; and, for the topic SeparationClause4,
    H-b₁ and H-B‴ (two computed constants of the separation note: `Separation.Hb1`, `Separation.HB3`); and, for the
    topic Separation6, in addition H-edge (`Separation.Hedge`, clause 2's lower bound) and H-out (`SepConfig.Hout`,
    clause 5 whole: the out-window sum's absolute convergence and its bound e^{−L}).  For the Session 24 topics
    SeparationClause4b and Separation6b, H-b₁ is NO LONGER displayed (b₁ is the proved real number b₁sym = (2e^{−1}/Z)²):
    the rung takes H-B‴ only; the assembly, the tight pair take H-B‴, H-edge, H-out; `rstar_of_21L` takes nothing displayed.
