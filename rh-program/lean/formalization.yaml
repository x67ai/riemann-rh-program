fidelity:
  divergences: >-
    Where the formal statements differ from the prose one ("Λ ≤ 0.2 from Polymath15 Theorem 1.2 at Table 1 row 2 with
    the numerical hypotheses verified") and from what Zeta23 proves; full ledger with source pointers in
    results/d1-m2a/packaging/FIDELITY.md.
    (a) y-band asymmetry: the Lane A hypotheses `AsymEnclOK`/`TailOK` quantify y over [y₀, yA] with yA = 3962323/5000000 =
    0.7924646, which is yA − √(157/250) = 8.975·10⁻⁸ ≈ 9.0·10⁻⁸ wider than the range y² ≤ 1 − 2t₀ = 157/250 that (ii′)
    needs (1.42·10⁻⁷ in the squares); so `TailOK` is "the tail region N ≥ N₁, y ∈ [y₀, yA]", a hair stronger than the prose
    (ii), not literally a sub-statement of it (EMIT-NOTES §4/§9; PLAN-REVIEW §6).
    (b) C-A6 (the tail row's Q₁ + Q₂ + Q₃ + Q₄ + E₁ < 2K) is kernel-checked on both literals but consumed by no proof;
    `cert_of_checkAsym` uses only K ≥ 1, C-A3 (only E < T per row), C-A4, C-A5; Lemma T's reduction "Σ < 2 ⟹ nonvanishing
    for N ≥ N₁" (SPEC §5.4) is prose and H-TAIL is displayed in conclusion form — "C-A6 is kernel-checked" must not be read
    as "the tail reduction is kernel-checked".
    (c) The producers are untrusted and five hypotheses are displayed — H1, H2-B (the seam rows enclose SOME holomorphic
    approximant f, which is not defined in Lean, plus the E/D bounds), H2-A (the window floors), H-TAIL, H3; the kernel
    checks integer relations on the literals and the coverage / argument-principle / glue proofs; the two-producer
    cross-checks are producer-side evidence, not formalized.  The exact label (SPEC §3.7): "kernel-checked modulo H1, H2
    (H2-B, H2-A, H-TAIL), H3" — never "fully machine-checked".
    (d) Ray form, not Λ: every statement concludes ∀ t ≥ 1/5, ∀ z, Ht t z = 0 → z.im = 0; Λ is never defined in Lean
    (design note §1.2), and the equivalence with Λ ≤ 0.2 rests on the ray structure {t : H_t real-zeroed} = [Λ, ∞)
    (de Bruijn monotonicity), which is prose.
    (e) `Polymath15Bridge'` is not Theorem 1.2 verbatim: (ii) restricted to x ≥ X + 1 ((ii′); the strip up to X + 1 is
    covered by (iii′) at t = t₀), the y-range written y² ≤ 1 − 2t₀ (no square root in the trusted layer), and (iii)
    replaced by the paper's own larger box X ≤ x ≤ X + 1, y₀ ≤ y ≤ 1, 0 ≤ t ≤ t₀ (p3); that Theorem 1.2 implies it is
    derivation D-H3 (SPEC §3.3), prose; H3 also carries `HtEntire` (M2b-class analysis), displayed (Defs.lean deviation
    record 2).
    (f) The generic statement (G) `dbn_ray_le_point2_of_certificates` is NOT a Zeta23 theorem: Zeta23 proves only the
    instance form (`lambda_le_point2`, `_arb`); (G) is derived in comparator/Solution/DBN.lean by the new lemma
    `DBNBridge.ray_of_certificates` (the instance proof with the data generic), and its side conditions — the rectangle's
    four reals, t₀ = 93/500, `At0`/`Ay0`/`AyA` exactly the instance's, ∃ r ∈ a.rows with r.Nlo ≤ 630783, the MONOLITHIC
    `checkBarrier` rather than SPEC §7.6's split form — are the builder's rendering of "what the glue actually uses", not a
    statement of record.  Also: the challenge's structures are re-declared types, bridged by field-wise transports and
    commutation lemmas (proved, not assumed) with the literal identities decided in the kernel; and the four (K)
    statements are an addition beyond the brief's (G)/(I).
    (g) Reductions by the builder: none — the trusted literal copy (20 157 lines, 227 defs, byte-identical to the Zeta23
    modules block for block) elaborated in 38 s; nothing was shrunk or sampled.  Deliberately not on the trusted side:
    `row2T0n`/`row2T0d` and the `_check` theorems (data only; the (K) statements restate them).
    (h) H1 is the exact box form on Mathlib's `riemannZeta` ((1 + y₀)/2 = 116733/200000, X/2 = 2 500 000 097 429; SPEC §3.6
    corrected the design note's rounding direction); its discharge by Platt–Trudgian Theorem 1 (height 3 000 175 332 800,
    margin 500 175 235 371) is prose.
    (i) Two producer legs are two theorems per kind, each pairing its own Lane B and Lane A literal, never merged (D-R3);
    no formal statement combines the legs or states their agreement.
    (j) Proved rather than displayed, with recorded modeling choices: `hHol` from `HtEntire` and L-B3 (`Bt` ≠ 0, differentiable
    off the imaginary axis; `Bt` transcribed with Mathlib's principal `Complex.log` and `cpow` with real base π, SPEC §3.4);
    the argument principle (L-B0); coverage in t and in N.  `Ht` is a Bochner integral with junk value 0 if the integrand
    is not integrable — the anti-cheat direction: junk makes the target FALSE, not vacuous; integrability is not proved
    in M2a.
    (k) Nothing in Lean ties the trusted literals to the transcripts of record: the (I)/(K) statements are about
    ChallengeDeps.DBN.Instance02.row2Barrier{MP,ARB} / row2Asym{MP,ARB}; that those 20 157 lines are the contents of
    results/d1-m2a/transcripts/row2/*.json, transcripts/row2-arb/*.json and lane-a/asym-{mp,arb}.json is established only
    by untrusted scripts (emit_challengedeps_instance02.py, cmp_literal_blocks.py; independently re-derived by
    check-o/check_literals.py, 145 533 integers, 0 mismatches); the kernel identities tie the trusted copy to the Zeta23
    copy, not to the JSON.  Benign (the literals occur only inside displayed hypotheses), but the formal chain stops at
    the Lean literals.  [Added 2026-09-10 after the independent checker's FIX-FIRST 2, CHECK-O.md §8.]
    (l) f_DH (D-R8, added 2026-09-10): the identification of the producers' f_DH (mpmath `hurwitz_encl.py` STEP 3′ /
    `mp.zeta(s, a)`; Arb `acb_hurwitz_zeta`) with Lean's `Zeta23.W1.fDH` on Mathlib's `HurwitzZeta.hurwitzZeta` is a
    META-level convention match, not a Lean theorem: all three realize Σ_{n≥0}(n+a)^{−s} with a = j/5 ∈ (0,1) on Re s > 1
    (Mathlib `hasSum_hurwitzZeta_of_one_lt_re`, stated in FDH.lean as `hasSum_hurwitzZeta_one_fifth`), and uniqueness of
    analytic continuation identifies the three entire functions — of the same standing as "mpmath's zeta / Arb's acb_zeta
    is Mathlib's riemannZeta" on the ζ leg; it is where H-ENCL_DH's meaning lives (dr8/PRICING-fDH.md §1.3).  κ is a
    transcription of FORMAT §9.2 checked to 60 digits (dr8/kappa-check.log).  `W1Data` carries no function tag (the JSON
    `function` field is dropped at the JSON→Lean boundary), so the function enters only through `W1EnclOK f d` and the
