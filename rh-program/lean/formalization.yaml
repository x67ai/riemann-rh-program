    authors:
      - "rh-program (Claude under Kunal Tyagi's direction)"
    id: "rh-program/results/d1-m2a/SPEC.md"
    type: "other"
    location: "§1.1 (the ray theorem), §3.3–§3.7 (the amended bridge, Bt, HtEntire, H1, the honest label), §5 (Lane A), §6 (what is displayed), §8.3 (soundness theorems)"
    relationship: "formalizes"
    author_endorsement: "n/a"
  - title: "M2a/M2b design note (m2a-m2b-design.md, the D-R2 repair note): ray form §1.2, trust model, work breakdown"
    authors:
      - "rh-program (Claude under Kunal Tyagi's direction)"
    id: "rh-program/results/d1-m0/m2a-m2b-design.md"
    type: "other"
    location: "§1.2 (ray form; Λ never defined), §1.3, §5, §7"
    relationship: "formalizes"
    author_endorsement: "n/a"
  - title: "Effective approximation of heat flow evolution of the Riemann ξ function, and a new upper bound for the de Bruijn–Newman constant"
    authors:
      - "D. H. J. Polymath"
    id: "https://doi.org/10.1007/s40687-019-0193-1"
    type: "article"
    location: "Theorem 1.2 (upper bound criterion) — the displayed analytic package H3 (`Polymath15Bridge'`, in the amended form of SPEC §3.3); eqs. (2), (6), (9)–(11) (Φ, H_t, B_t); (19) (the window index); Table 1 row 2 (the instance); §5.4's Lemma T for the tail (prose)"
    relationship: "formalizes"
    note: "Theorem 1.2 is NOT proved in Lean: it enters as the displayed hypothesis H3, together with the entirety of H_t.  The barrier and asymptotic computations follow the paper's method with two independent producers; their enclosure claims enter as the displayed hypotheses H2-B, H2-A, H-TAIL."
    author_endorsement: "not-contacted"
  - title: "The Riemann hypothesis is true up to 3·10¹²"
    authors:
      - "Dave Platt"
      - "Tim Trudgian"
    id: "https://doi.org/10.1112/blms.12460"
    type: "article"
    location: "Theorem 1 (RH verified to height 3 000 175 332 800) discharges, in prose, the displayed hypothesis H1 = `ZeroVerification (116733/200000) 2500000097429`"
    relationship: "background"
    author_endorsement: "not-contacted"
  - title: "A4 no-go paper: grid-Parseval decoupling and the corner theorem (rh-program/results/a4-no-go/paper.md)"
    authors:
      - "rh-program (Claude under Kunal Tyagi's direction)"
    id: "rh-program/results/a4-no-go/paper.md"
    type: "other"
    location: "Lemma 3.8, Theorem 3.9, Lemma 4.2, Theorem 4.3"
    relationship: "formalizes"
    author_endorsement: "n/a"
  - title: "D1 M1 v1 W1 transcript format and checker (FORMAT.md; the v1.1 discharge of the argument principle)"
    authors:
      - "rh-program (Claude under Kunal Tyagi's direction)"
    id: "rh-program/results/d1-m1/FORMAT.md"
    type: "other"
    location: "§7 (the checker C1–C11), §8 (H-ENCL; H-AP, discharged in v1.1)"
    relationship: "formalizes"
